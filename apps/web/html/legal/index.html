<!doctype html>
<html lang="ja" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightlist</title>
    <meta name="description" content="" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://lightlist.app/privacy/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/brand/logo.svg" sizes="any" type="image/svg+xml" />
    <link
      rel="apple-touch-icon"
      href="/icons/apple-touch-icon.png"
      sizes="180x180"
      type="image/png"
    />
    <meta name="application-name" content="Lightlist" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lightlist" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#030712"
    />
    <link
      rel="preload"
      as="style"
      href="/fonts/gen-interface-jp/400.css"
      data-font-stylesheet
    />
    <link
      rel="preload"
      as="style"
      href="/fonts/gen-interface-jp/500.css"
      data-font-stylesheet
    />
    <link
      rel="preload"
      as="style"
      href="/fonts/gen-interface-jp/600.css"
      data-font-stylesheet
    />
    <link
      rel="preload"
      as="style"
      href="/fonts/gen-interface-jp/700.css"
      data-font-stylesheet
    />
    <link
      rel="preload"
      as="style"
      href="/fonts/gen-interface-jp/display-700.css"
      data-font-stylesheet
    />
    <noscript>
      <link rel="stylesheet" href="/fonts/gen-interface-jp/400.css" />
      <link rel="stylesheet" href="/fonts/gen-interface-jp/500.css" />
      <link rel="stylesheet" href="/fonts/gen-interface-jp/600.css" />
      <link rel="stylesheet" href="/fonts/gen-interface-jp/700.css" />
      <link rel="stylesheet" href="/fonts/gen-interface-jp/display-700.css" />
    </noscript>

    <script src="/font-loader.js" defer></script>
    <link rel="stylesheet" href="../../src/styles/legal.css" />
  </head>
  <body>
    <div class="ll-h-dvh ll-w-full ll-overflow-hidden ll-font-sans">
      <div class="ll-h-full ll-w-full ll-overflow-y-auto">
        <a
          href="#main-content"
          class="ll-pointer-events-none ll-absolute ll-top-2 ll-z-2000 ll-translate-y-neg-16 ll-rounded-lg ll-bg-gray-900 ll-px-4 ll-py-2 ll-text-sm ll-font-semibold ll-text-gray-50 ll-opacity-0 ll-shadow-lg ll-transition ll-focus-pointer-events-auto ll-focus-translate-y-0 ll-focus-opacity-100 ll-focus-outline-1 ll-focus-outline-2 ll-focus-outline-offset-2 ll-focus-outline-gray-600 ll-dark-bg-gray-50 ll-dark-text-gray-900 ll-dark-focus-outline-gray-300"
          style="inset-inline-start: 1rem"
          data-i18n="common.skipToMain"
          >メインコンテンツへ移動</a
        >
        <div
          class="ll-flex ll-min-h-screen ll-flex-col ll-lp-bg-white ll-text-gray-900"
        >
          <header class="ll-border-b ll-lp-border-black-10">
            <div
              class="ll-mx-auto ll-flex ll-lp-max-w-6xl ll-items-center ll-lp-px-6 ll-py-3"
            >
              <a
                href="/"
                class="ll-flex ll-items-center ll-lp-gap-2x5 ll-lp-sm-gap-3"
              >
                <img
                  src="/brand/logo.svg"
                  alt=""
                  aria-hidden="true"
                  class="ll-block ll-h-8 ll-w-auto ll-lp-sm-h-9"
                />
                <span
                  class="ll-lp-text-base ll-font-semibold ll-lp-tracking-extra-wide ll-lp-text-neutral-850 ll-lp-sm-text-lg"
                >
                  Lightlist
                </span>
              </a>
            </div>
          </header>

          <main
            id="main-content"
            tabindex="-1"
            class="ll-flex-1 ll-lp-px-6 ll-lp-pb-16 ll-lp-pt-12 ll-lp-sm-pb-24 ll-lp-sm-pt-20"
          >
            <article class="ll-legal ll-mx-auto ll-max-w-3xl">
              <!--legal:content-->
            </article>
          </main>

          <footer
            class="ll-lp-bg-neutral-100 ll-lp-px-6 ll-py-10 ll-text-center"
          >
            <nav class="ll-legal-nav"><!--legal:nav--></nav>
            <p class="ll-mt-6 ll-text-sm ll-text-gray-600">© Lightlist</p>
          </footer>
        </div>
      </div>
    </div>
  </body>
</html>
